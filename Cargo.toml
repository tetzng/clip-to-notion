[package]
name = "clip-to-notion"
version = "0.1.2"
edition = "2021"
description = "Efficiently fetch the title and metadata from a URL and tidily organize them into a Notion database."
readme = "README.md"
repository = "https://github.com/tetzng/clip-to-notion"
license = "Apache-2.0"
keywords = ["notion", "bookmarks"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.40", features = ["derive"] }
directories = "6.0.0"
reqwest = { version = "0.12.20", features = ["blocking", "json"] }
scraper = "0.23.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
toml = "0.8.23"

[dev-dependencies]
mockito = "1.7.0"

[[bin]]
name = "ctn"
path = "src/main.rs"
